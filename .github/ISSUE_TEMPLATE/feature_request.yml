name: 💡 Feature request
description: An idea for something new, or a better way to do something
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what gets in the way today. A problem is more useful to us than a ready-made solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How might it work?
      description: Your idea, sketches, or how another tool does it.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this
