<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentsMonitor display preview</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="heading">
        <h1 data-i18n="title">AgentsMonitor display preview</h1>
        <p data-i18n="lead"></p>
      </div>
      <div class="controls">
        <label class="inline"><span data-i18n="theme"></span>
          <select id="theme"></select>
        </label>
        <div class="seg" id="lang">
          <button data-lang="en">EN</button>
          <button data-lang="zh">中文</button>
        </div>
      </div>
    </header>

    <main>
      <section class="device">
        <div class="bezel" id="bezel">
          <canvas id="screen" width="466" height="466"></canvas>
          <button class="side" id="side" data-i18n-title="side.title"></button>
          <button class="side low" id="boot" data-i18n-title="boot.title"></button>
        </div>
        <p class="about" id="theme-about"></p>
        <div class="readout" id="readout"></div>
        <p class="hint" data-i18n="hint"></p>
      </section>

      <section class="panel">
        <div class="group">
          <h2 data-i18n="source"></h2>
          <div class="seg" id="source">
            <button data-v="script" class="on" data-i18n="source.script"></button>
            <button data-v="live" data-i18n="source.live"></button>
          </div>

          <div id="script-box">
            <label><span data-i18n="scenario"></span>
              <select id="scenario"></select>
            </label>
            <p class="note" id="scenario-note"></p>
            <div class="row">
              <button id="play"></button>
              <button id="restart" data-i18n="restart"></button>
              <label class="inline"><span data-i18n="speed"></span>
                <select id="speed">
                  <option value="1">1×</option>
                  <option value="3">3×</option>
                  <option value="10">10×</option>
                  <option value="30">30×</option>
                </select>
              </label>
              <span class="clock" id="clock"></span>
            </div>
          </div>

          <div id="live-box" hidden>
            <label><span data-i18n="ws.url"></span>
              <input id="ws-url" value="ws://127.0.0.1:7788/v1/ws" spellcheck="false" />
            </label>
            <label><span data-i18n="ws.token"></span>
              <input id="ws-token" type="password" data-i18n-placeholder="ws.tokenHint" autocomplete="off" spellcheck="false" />
            </label>
            <div class="row">
              <button id="ws-connect" data-i18n="ws.connect"></button>
              <span class="note" id="ws-state"></span>
            </div>
            <p class="note" data-i18n-html="ws.note"></p>
          </div>
        </div>

        <div class="group" id="events-box">
          <h2 data-i18n="events"></h2>
          <div class="grid">
            <button data-ev="permission" data-i18n="ev.permission"></button>
            <button data-ev="input" data-i18n="ev.input"></button>
            <button data-ev="answer" data-i18n="ev.answer"></button>
            <button data-ev="done" data-i18n="ev.done"></button>
            <button data-ev="error" data-i18n="ev.error"></button>
            <button data-ev="open" data-i18n="ev.open"></button>
            <button data-ev="start" data-i18n="ev.start"></button>
            <button data-ev="stale" data-i18n="ev.stale"></button>
            <button data-ev="end" data-i18n="ev.end"></button>
            <button data-ev="link" data-i18n="ev.link"></button>
          </div>
        </div>

        <div class="group">
          <h2 data-i18n="sound"></h2>
          <div class="row">
            <button id="sound"></button>
            <label class="inline"><span data-i18n="volume"></span> <input type="range" id="volume" min="0" max="1" step="0.05" value="0.7" /></label>
          </div>
          <div class="row">
            <span class="note" data-i18n="listen"></span>
            <button data-cue="0" data-i18n="cue.0"></button>
            <button data-cue="1" data-i18n="cue.1"></button>
            <button data-cue="2" data-i18n="cue.2"></button>
            <button data-cue="3" data-i18n="cue.3"></button>
            <button data-cue="4" data-i18n="cue.4"></button>
          </div>
          <ol class="log" id="log"></ol>
        </div>

        <div class="group">
          <h2 data-i18n="display"></h2>
          <div class="row">
            <label class="inline"><span data-i18n="zoom"></span>
              <select id="zoom">
                <option value="0.5" data-i18n="zoom.half"></option>
                <option value="1" selected data-i18n="zoom.one"></option>
                <option value="1.5">1.5×</option>
                <option value="2" data-i18n="zoom.two"></option>
              </select>
            </label>
            <label class="inline"><span data-i18n="fps"></span>
              <select id="fps">
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="60" selected data-i18n="fps.device"></option>
              </select>
            </label>
          </div>
        </div>

        <div class="group">
          <h2 data-i18n="sessions"></h2>
          <table id="sessions"></table>
        </div>
      </section>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
