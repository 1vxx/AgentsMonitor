[package]
name = "agentsmon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agentsmon-protocol = { version = "0.1.0", path = "../agentsmon-protocol" }
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.191"
parking_lot = "0.13.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "signal", "time", "sync", "io-util"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
