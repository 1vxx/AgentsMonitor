<svg xmlns="http://www.w3.org/2000/svg" viewBox="1 1 30 30" width="120" height="120" role="img" aria-label="agentsmon">
  <!-- The dashboard's mark: a clay planet with a satellite on a tilted orbit, on paper in light and night sky in dark -->
  <style>
    .a{stop-color:#fff}.b{stop-color:#f0f2f9}.c{stop-color:#dfe3f1}
    .ink{stroke:#23336e}.edge{stroke:#23336e;stroke-opacity:.18}.star{fill:#23336e}.sat{fill:#3a52c4}
    @media (prefers-color-scheme:dark){
      .a{stop-color:#2c3366}.b{stop-color:#12152b}.c{stop-color:#080912}
      .ink{stroke:#fff}.edge{stroke:#fff;stroke-opacity:.12}.star{fill:#fff}.sat{fill:#9ec0ff}
    }
  </style>
  <defs>
    <radialGradient id="tile" cx=".3" cy=".2" r="1">
      <stop class="a" offset="0"/>
      <stop class="b" offset=".6"/>
      <stop class="c" offset="1"/>
    </radialGradient>
    <radialGradient id="planet" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ffd2b8"/>
      <stop offset=".45" stop-color="#ef8a66"/>
      <stop offset="1" stop-color="#a8452a"/>
    </radialGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#tile)"/>
  <rect class="edge" x="1.5" y="1.5" width="29" height="29" rx="8.5" fill="none" stroke-width=".5"/>
  <circle class="star" cx="8" cy="8.5" r=".6" opacity=".7"/>
  <circle class="star" cx="24.5" cy="25" r=".5" opacity=".5"/>
  <circle class="star" cx="25.5" cy="7" r=".4" opacity=".6"/>
  <g transform="rotate(-24 16 16)">
    <path class="ink" d="M4.6 16a11.4 4.6 0 0 1 22.8 0" fill="none" stroke-width="1" stroke-opacity=".35"/>
    <circle cx="16" cy="16" r="5.6" fill="url(#planet)"/>
    <path class="ink" d="M27.4 16a11.4 4.6 0 0 1-22.8 0" fill="none" stroke-width="1.2" stroke-opacity=".85"/>
    <circle class="sat" cx="27.4" cy="16" r="1.8"/>
  </g>
</svg>
