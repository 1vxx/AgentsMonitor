    <script>
      // The chosen theme, set before the first paint so the page never opens
      // in the system one and then switches. nav.ts keeps it under this key.
      try {
        const v = localStorage.getItem('agentsmon.theme')
        if (v === 'dark' || v === 'light') document.documentElement.dataset.theme = v
      } catch {}
